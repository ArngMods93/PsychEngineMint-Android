name: Build Android

on:
  push:
    branches: [ mod, main ]
  pull_request:
    branches: [ mod, main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag for the GitHub Release (leave empty to skip the release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build-tools and NDK
        run: |
          sdkmanager --install "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvlc-dev libvlccore-dev vlc

      - name: Clean haxelib folder
        run: rm -rf ~/haxelib

      - name: Install Haxe dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Configure Android SDK/NDK paths
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Setup lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Generate placeholder keystore if missing
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore key.keystore \
              -storepass KEYSTORE_PASSWORD \
              -alias KEYSTORE_ALIAS \
              -keypass KEYSTORE_ALIAS_PASSWORD \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PsychEngineMint, OU=None, O=None, L=None, S=None, C=US"
          fi

      - name: Compile
        run: haxelib run lime build Project.xml android -D officialBuild

      - name: Locate APK
        id: apk
        run: |
          APK=$(find export -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under export/"
            find export -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: ${{ steps.apk.outputs.path }}

      - name: Create Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: ${{ steps.apk.outputs.path }}
